<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="踏査写真">
<meta name="theme-color" content="#1f2a37">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>踏査写真</title>
<style>
:root{
  --bg:#eef1f4; --panel:#fff; --ink:#18212b; --sub:#5b6773; --line:#cfd6dd;
  --head:#1f2a37; --accent:#f2b705; --ok:#2e8b57; --warn:#c0392b; --tile:#f7f9fb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;}
body{padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:#334355;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:16px;font-weight:600}
.hbtn.primary{background:var(--accent);color:#1b1b1b}
main{padding:16px;max-width:1100px;margin:0 auto}
.summary{color:var(--sub);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;
  font-size:15px;color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:92px}
.card .no{font-size:22px;font-weight:700}
.card .nm{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;margin-top:auto}
.dot{width:14px;height:14px;border-radius:50%;background:#dfe4e9;border:1px solid #c5ccd3}
.dot.on{background:var(--ok);border-color:var(--ok)}
.card.done{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .title{flex:1;font-size:20px;font-weight:700}
.bar .title small{display:block;font-size:14px;color:var(--sub);font-weight:500}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:16px;color:var(--ink)}
.nav:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{background:var(--panel);border:2px dashed #aab4bf;border-radius:14px;position:relative;overflow:hidden;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column}
.slot.wide{grid-column:1/-1;aspect-ratio:auto;height:200px}
.slot.has{border:2px solid var(--ok);background:#111}
.slot img{width:100%;height:100%;object-fit:contain;display:block}
.slot .lbl{position:absolute;top:8px;left:8px;background:var(--head);color:#fff;font-weight:700;
  font-size:16px;padding:5px 11px;border-radius:8px;z-index:2}
.slot .empty{font-size:17px;color:var(--sub);text-align:center;line-height:1.7;pointer-events:none}
.slot .empty b{display:block;font-size:40px;color:#8a96a3;line-height:1}
.slot .broken{color:#fff;font-size:15px;text-align:center;line-height:1.7;padding:0 16px}
.slot .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:8px;z-index:2}
.tbtn{border:0;border-radius:10px;padding:11px 15px;font-size:15px;font-weight:600;background:rgba(255,255,255,.92);color:var(--ink)}
.tbtn.del{color:var(--warn)}
.slot .hit{position:absolute;inset:0;background:transparent;border:0;width:100%}
.sec{margin:22px 0 10px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec small{font-size:13px;color:var(--sub);font-weight:500}
.slot.add{border-style:dashed;background:var(--tile)}
.slot .memo{position:absolute;left:8px;right:8px;bottom:62px;color:#fff;font-size:15px;font-weight:600;
  text-shadow:0 1px 3px #000;z-index:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editname{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.editname small::after{content:"　✎ 編集";color:#2b6cb0;font-weight:600}
.card.addcard{align-items:center;justify-content:center;border-style:dashed;color:var(--sub);font-weight:600}
.card .ex{font-size:13px;color:var(--sub);margin-left:4px}
.busy{position:absolute;inset:0;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;font-weight:600;z-index:3}
dialog{border:0;border-radius:16px;padding:0;width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:20px}
.dlg h2{margin:0 0 6px;font-size:19px}
.dlg p{color:var(--sub);font-size:14px;margin:6px 0 10px;line-height:1.6}
textarea{width:100%;height:220px;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;color:var(--ink)}
.btn.primary{background:var(--head);color:#fff;border-color:var(--head)}
.btn.danger{color:var(--warn);border-color:#e3b2ac}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#18212b;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hbtn.proj{background:#fff;color:var(--head);max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:16px;text-align:left;color:var(--ink)}
.pitem.cur{border:2px solid var(--head);background:#f4f7fa}
.pitem .pn{flex:1;font-weight:700}
.pitem .pc{color:var(--sub);font-size:14px}
.pitem .mk{width:22px;height:22px;border-radius:50%;border:2px solid #aab4bf;flex:none}
.pitem.cur .mk{border:7px solid var(--head)}
.startbar{display:flex;align-items:center;gap:12px;margin:-4px 0 14px;flex-wrap:wrap}
.startbtn{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:700;background:var(--ok);color:#fff}
.startbtn.on{background:#c0392b;color:#fff}
.startinfo{color:var(--sub);font-size:14px;line-height:1.5}
.slot svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tbtn.arw{color:#c0392b}
#arrowEd{position:fixed;inset:0;z-index:50;background:#111;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#arrowEd.show{display:flex}
#arrowEd .top,#arrowEd .bot{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1f2a37;color:#fff;flex-wrap:wrap}
#arrowEd .top .ttl{flex:1;font-weight:700;font-size:17px}
#arrowEd .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#arrowEd .stage img,#arrowEd .stage svg{position:absolute;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#arrowEd .stage svg{touch-action:none}
.eb{border:0;border-radius:10px;padding:11px 14px;font-size:16px;font-weight:700;background:#334355;color:#fff}
.eb.pri{background:var(--accent);color:#1b1b1b}
.eb.red{background:#c0392b}
.eb:disabled{opacity:.35}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.wlab{font-size:14px;color:#cdd5dd}
#arrowEd input[type=range]{width:160px;height:30px}
.hint{font-size:13px;color:#cdd5dd;width:100%}
.worker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;margin:0 0 12px}
.worker b{font-size:16px}
.worker select,.worker input{font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);font-family:inherit}
.worker input{width:11em}
.worker.none{border:2px solid var(--warn)}
.worker .wmsg{color:var(--warn);font-size:14px;font-weight:600}
@media (max-width:560px){.slots{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1 id="htitle">踏査写真</h1>
  <button class="hbtn proj" id="btnProj">業務：<span id="projName"></span> ▾</button>
  <button class="hbtn" id="btnSettings">設定</button>
  <button class="hbtn primary" id="btnExport">ZIP保存</button>
</header>
<main id="app"></main>
<input type="file" id="picker" accept="image/*" hidden>

<dialog id="dlgSettings"><div class="dlg">
  <h2>橋梁リスト</h2>
  <p>Excelの「点検橋梁一覧表」で <b>No列と橋梁名列（A〜B列）</b> をコピーして貼り付けてください。<br>
     1行に「No（タブ／カンマ／空白）橋梁名」。空のままなら No.1〜35 を表示します。<br>
     1橋ずつ入れる場合は、一覧の「＋ 橋を追加」か、各橋の画面で橋梁名をタップしてください。</p>
  <textarea id="taList" placeholder="1	156号橋&#10;2	○○橋"></textarea>
  <div class="row">
    <button class="btn" id="btnCloseSet">閉じる</button>
    <button class="btn primary" id="btnSaveList">リストを保存</button>
  </div>
  <hr>
  <h2>写真データ（表示中の業務）</h2>
  <p id="storeInfo">—</p>
  <div class="row">
    <button class="btn danger" id="btnClearAll">この業務の写真をすべて削除</button>
  </div>
</div></dialog>

<dialog id="dlgProj"><div class="dlg">
  <h2>業務の切り替え</h2>
  <p>業務ごとに橋梁リスト・写真・ZIPが分かれます。タップした業務に切り替わります。</p>
  <div class="plist" id="plist"></div>
  <div class="row">
    <button class="btn" id="btnProjAdd">＋ 業務を追加</button>
    <button class="btn" id="btnProjRename">表示中の業務名を変更</button>
  </div>
  <div class="row">
    <button class="btn danger" id="btnProjDel">表示中の業務を削除</button>
    <button class="btn primary" id="btnProjClose">閉じる</button>
  </div>
</div></dialog>

<div id="arrowEd">
  <div class="top">
    <span class="ttl" id="aeTitle">矢印</span>
    <button class="eb" id="aeCancel">キャンセル</button>
    <button class="eb pri" id="aeDone">完了</button>
  </div>
  <div class="stage" id="aeStage"><img id="aeImg" alt=""><svg id="aeSvg"></svg></div>
  <div class="bot">
    <button class="eb" id="aeAdd">＋ 矢印</button>
    <button class="eb" id="aeFlip">向きを反転</button>
    <button class="eb red" id="aeDel">削除</button>
    <span class="wlab">太さ</span><input type="range" id="aeW" min="3" max="40" step="1" value="10">
    <span id="aeSw"></span>
    <div class="hint">写真の上をなぞると矢印を追加。矢印をタップで選択 → 両端の○で向き・長さ、中央をドラッグで移動。</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ===== 設定 =====
// k はZIP内ファイル名（Excelマクロの検索キー）。表示順＝踏査表の枠
const SLOTS = [
  {k:'kyoureki',  n:'橋歴板', wide:true},
  {k:'kyoumen',   n:'橋面'},
  {k:'sokumen',   n:'側面'},
  {k:'ketashita', n:'桁下'},
  {k:'kabukou',   n:'下部工'},
];
const MAX_EDGE = 1280;      // 縮小後の長辺(px)：1280×960＝約120万画素（CALSの目安程度）
const JPEG_Q   = 0.80;
const DEFAULT_COUNT = 35;
const LS_PROJ = 'tousa.projects', LS_CUR = 'tousa.current';
let PID = '', LS_LIST = '', LS_EXPORT = '', LS_LOG = '';   // 表示中の業務ID と その業務用の保存キー
// 作業者（iPadを持ち出す人）。プルダウンの候補以外は「その他」で入力。iPad内に保存し、いつでも変更できる
const WORKERS = ['青木','髙原','山口','赤池'];
const LS_WORKER = 'tousa.worker';
const getWorker = ()=> (localStorage.getItem(LS_WORKER)||'').trim();
function setWorker(v){ v = (v||'').trim(); v ? localStorage.setItem(LS_WORKER, v) : localStorage.removeItem(LS_WORKER); }

// ===== IndexedDB =====
let dbp;
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open('tousa-photo',1);
    r.onupgradeneeded = ()=> r.result.createObjectStore('photos');
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((res,rej)=>{
    const t = d.transaction('photos', mode), s = t.objectStore('photos');
    const out = fn(s);
    t.oncomplete = ()=> res(out && 'result' in out ? out.result : undefined);
    t.onerror = ()=> rej(t.error); t.onabort = ()=> rej(t.error || new Error('保存できませんでした'));
  });
}
// 写真のキーは「業務ID|No|部位」。画面側では業務IDを除いた「No|部位」で扱う
const fk = (k)=> PID + '|' + k;
const range = (pid)=> IDBKeyRange.bound(pid + '|', pid + '|￿');
const putPhoto = (key,blob)=> tx('readwrite', s=> s.put({blob, ts:Date.now()}, fk(key)));
const putRec   = (key,val)=> tx('readwrite', s=> s.put(val, fk(key)));
const delPhoto = (key)=> tx('readwrite', s=> s.delete(fk(key)));
const getPhoto = (key)=> tx('readonly', s=> s.get(fk(key)));
const allKeys  = async ()=> (await tx('readonly', s=> s.getAllKeys(range(PID)))).map(k=> String(k).slice(PID.length+1));
const clearAll = ()=> tx('readwrite', s=> s.delete(range(PID)));
const keyOf = (no,k)=> no + '|' + k;
const EXTRA = 'sonota';
const getAll = ()=> tx('readonly', s=> s.getAll());
// iPad（Safari）対策：IndexedDBから読んだ写真をそのまま同じキーへ書き戻すと、
// 上書きの際に写真の実体が消えて「？」表示になることがある。書き戻す前に必ずメモリ上へ複製する
async function freshBlob(b){ return new Blob([await b.arrayBuffer()], {type: b.type || 'image/jpeg'}); }
async function rewriteRec(key, rec, changes){
  const {key:_k, ...val} = rec;
  Object.assign(val, changes);
  val.blob = await freshBlob(rec.blob);
  await putRec(key, val);
}

// ===== 橋梁リスト =====
function loadList(){
  try{ const v = JSON.parse(localStorage.getItem(LS_LIST)||'null'); if(Array.isArray(v) && v.length) return v; }catch(e){}
  return Array.from({length:DEFAULT_COUNT},(_,i)=>({no:i+1,name:''}));
}
function saveList(l){ l.sort((a,b)=>a.no-b.no); localStorage.setItem(LS_LIST, JSON.stringify(l)); }
function editBridge(no){
  const l = loadList(); let b = l.find(x=>x.no===no);
  const v = prompt(`No.${no} の橋梁名を入力`, b ? b.name : '');
  if(v===null) return false;
  if(!b){ b={no,name:''}; l.push(b); }
  b.name = v.trim(); saveList(l); return true;
}
function addBridge(){
  const l = loadList(), next = l.reduce((m,b)=>Math.max(m,b.no),0)+1;
  const n = prompt('追加する橋のNo', String(next)); if(n===null) return;
  const no = parseInt(n,10); if(!(no>0)){ alert('Noは数字で入力してください。'); return; }
  if(l.some(b=>b.no===no)){ alert(`No.${no} は既にあります。`); return; }
  const name = prompt(`No.${no} の橋梁名`, ''); if(name===null) return;
  l.push({no, name:name.trim()}); saveList(l); location.hash = '#b/' + no;
}
function parseList(text){
  const out=[]; let seq=0;
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    const m = line.match(/^(\d{1,3})[\t,，\s　]+(.*)$/);
    if(m){ out.push({no:+m[1], name:m[2].trim()}); seq=+m[1]; }
    else if(/^\d{1,3}$/.test(line)){ out.push({no:+line,name:''}); seq=+line; }
    else if(!/^(No|例)/i.test(line)){ seq++; out.push({no:seq,name:line}); }
  }
  const seen=new Set(); return out.filter(b=> b.no>0 && !seen.has(b.no) && seen.add(b.no));
}

// ===== 踏査開始の記録（元写真の仕分け用） =====
function loadLog(){ try{ const v = JSON.parse(localStorage.getItem(LS_LOG)||'[]'); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function addStart(no){ const l = loadLog(); l.push({no, t:Date.now(), w:getWorker()}); localStorage.setItem(LS_LOG, JSON.stringify(l)); }
function addEnd(no){ const l = loadLog(); l.push({no, t:Date.now(), end:true, w:getWorker()}); localStorage.setItem(LS_LOG, JSON.stringify(l)); }
// 踏査中の橋（最後の記録が「開始」ならその橋、なければ null）
function activeNo(){ const l = loadLog(), x = l[l.length-1]; return x && !x.end ? x.no : null; }
// その橋の踏査時間帯の表示（例：10:05〜10:40、11:30〜踏査中）
function spans(no){
  const l = loadLog(), out = []; let cur = null;
  for(const x of l){
    if(!x.end && x.no===no){ if(cur) out.push(hm(cur)+'〜'); cur = x.t; }
    else if(cur){ out.push(hm(cur)+'〜'+hm(x.t)); cur = null; }   // 終了、または別の橋の開始で区切る
  }
  if(cur) out.push(hm(cur)+'〜踏査中');
  return out;
}
const hm = (t)=>{ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
function fmtDT(t){
  const d=new Date(t), z=(n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}

// JPEGのEXIFから撮影日時（DateTimeOriginal）を読む。なければ null
async function exifTime(file){
  try{
    const buf = await file.slice(0, 262144).arrayBuffer(), v = new DataView(buf);
    if(v.getUint16(0) !== 0xFFD8) return null;
    let p = 2;
    while(p + 4 < v.byteLength){
      const mk = v.getUint16(p), len = v.getUint16(p+2);
      if(mk === 0xFFE1 && v.getUint32(p+4) === 0x45786966){          // "Exif"
        const t = p + 10, le = v.getUint16(t) === 0x4949;
        const u16 = (o)=> v.getUint16(t+o, le), u32 = (o)=> v.getUint32(t+o, le);
        const str = (o,n)=>{ let r=''; for(let i=0;i<n-1;i++){ const c=v.getUint8(t+o+i); if(!c) break; r+=String.fromCharCode(c);} return r; };
        const find = (ifd, tag)=>{ const n=u16(ifd); for(let i=0;i<n;i++){ const e=ifd+2+i*12; if(u16(e)===tag) return e; } return -1; };
        const ifd0 = u32(4); let val = null;
        const ex = find(ifd0, 0x8769);
        if(ex >= 0){ const exi = u32(ex+8); for(const tg of [0x9003,0x9004]){ const e=find(exi,tg); if(e>=0){ val=str(u32(e+8),u32(e+4)); break; } } }
        if(!val){ const e=find(ifd0,0x0132); if(e>=0) val=str(u32(e+8),u32(e+4)); }
        const m = val && val.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
        return m ? new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime() : null;
      }
      if((mk & 0xFF00) !== 0xFF00 || mk === 0xFFDA) break;
      p += 2 + len;
    }
  }catch(e){}
  return null;
}

// ===== 画像縮小 =====
async function resize(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image(); img.src = url; await img.decode();
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, MAX_EDGE/Math.max(w,h));
    const c = document.createElement('canvas'); c.width = Math.round(w*s); c.height = Math.round(h*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);   // EXIFの向きはSafariが反映済み
    return await new Promise((res,rej)=> c.toBlob(b=> b?res(b):rej(new Error('変換失敗')),'image/jpeg',JPEG_Q));
  } finally { URL.revokeObjectURL(url); }
}

// ===== ZIP（無圧縮・ASCIIファイル名） =====
const CRC = (()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0, cenSize=0;
  const d=new Date(), time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),
        date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,time,true); lh.setUint16(12,date,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,size,true); lh.setUint32(22,size,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,time,true); ch.setUint16(14,date,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true); ch.setUint32(24,size,true); ch.setUint16(28,name.length,true);
    ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    cen.push(ch.buffer,name); cenSize+=46+name.length; off+=30+name.length+size;
  }
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cenSize,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

const esc = (s)=> String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function freeUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
// 写真が読めなかったときは、少し待って読み直す（最大3回）。それでも駄目なら案内を出す
function retryImg(img, key){
  let n = 0;
  img.addEventListener('error', async ()=>{
    if(n >= 3){
      img.replaceWith($('<div class="broken">写真を表示できません。<br>「差し替え」で入れ直してください</div>'));
      return;
    }
    n++;
    await new Promise(r=> setTimeout(r, 500*n));
    if(!img.isConnected) return;
    const rec = await getPhoto(key).catch(()=> null);
    if(!rec || !img.isConnected) return;
    const u = URL.createObjectURL(rec.blob); urls.push(u); img.src = u;
  });
}

async function stats(){
  const m = new Map(), keys = await allKeys();
  for(const key of keys){
    const [n,k] = String(key).split('|'), no=+n;
    if(!m.has(no)) m.set(no,{set:new Set(), ex:0});
    if(k===EXTRA) m.get(no).ex++; else m.get(no).set.add(k);
  }
  return {m, total:keys.length};
}

// ===== 矢印（流水方向など） =====
// 矢印は写真とは別に {x1,y1,x2,y2,w,c} で保存（x,y＝写真幅・高さに対する0〜1、w＝写真の幅に対する太さ）
const ACOLORS = ['#e0412f','#f2c200','#ffffff','#1e88e5'];
// 矢印の外形（7点の多角形）。単位は写真のピクセル
function arrowPts(x1,y1,x2,y2,w){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const hl=Math.min(w*3.2, L*0.6), hw=w*1.6, sx=x2-ux*hl, sy=y2-uy*hl, h=w/2;
  return [[x1+px*h,y1+py*h],[sx+px*h,sy+py*h],[sx+px*hw,sy+py*hw],[x2,y2],[sx-px*hw,sy-py*hw],[sx-px*h,sy-py*h],[x1-px*h,y1-py*h]];
}
function arrowSvg(a, iw, ih, extra){
  const pts = arrowPts(a.x1*iw,a.y1*ih,a.x2*iw,a.y2*ih,a.w*iw).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const sw = Math.max(1, a.w*iw*0.12);
  const edge = a.c==='#ffffff' ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.85)';
  return `<polygon points="${pts}" fill="${a.c}" stroke="${edge}" stroke-width="${sw.toFixed(1)}" stroke-linejoin="round" ${extra||''}/>`;
}
// 枠のサムネイルに矢印を重ねる
function addOverlay(el, img, arrows){
  if(!arrows || !arrows.length) return;
  const put = ()=>{
    const iw=img.naturalWidth, ih=img.naturalHeight; if(!iw || !img.isConnected) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('class','ov'); svg.setAttribute('viewBox',`0 0 ${iw} ${ih}`); svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.innerHTML = arrows.map(a=>arrowSvg(a,iw,ih)).join('');
    img.after(svg);
  };
  (img.complete && img.naturalWidth) ? put() : img.addEventListener('load', put, {once:true});
}
// ZIP保存時に矢印を写真へ焼き込む
async function burnArrows(blob, arrows){
  const bmp = await createImageBitmap(blob), iw=bmp.width, ih=bmp.height;
  const c = document.createElement('canvas'); c.width=iw; c.height=ih;
  const g = c.getContext('2d'); g.drawImage(bmp,0,0); bmp.close && bmp.close();
  for(const a of arrows){
    const pts = arrowPts(a.x1*iw,a.y1*ih,a.x2*iw,a.y2*ih,a.w*iw);
    g.beginPath(); pts.forEach((p,i)=> i ? g.lineTo(p[0],p[1]) : g.moveTo(p[0],p[1])); g.closePath();
    g.lineJoin='round'; g.lineWidth=Math.max(1,a.w*iw*0.12);
    g.strokeStyle = a.c==='#ffffff' ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.85)'; g.stroke();
    g.fillStyle=a.c; g.fill();
  }
  const out = await new Promise((res,rej)=> c.toBlob(b=> b?res(b):rej(new Error('変換失敗')),'image/jpeg',0.9));
  c.width = c.height = 0;   // iPadのcanvasメモリをすぐ返す
  return out;
}

// ---- 矢印エディタ ----
const AE = { key:null, rec:null, arrows:[], sel:-1, iw:0, ih:0, scale:1, drag:null, color:ACOLORS[0], w:0.012, onDone:null, busy:false };
const aeEl = document.getElementById('arrowEd'), aeImg = document.getElementById('aeImg'),
      aeSvg = document.getElementById('aeSvg'), aeStage = document.getElementById('aeStage'), aeW = document.getElementById('aeW');
let aeUrl = null;

async function openArrowEditor(key, title, onDone){
  const rec = await getPhoto(key); if(!rec) return;
  AE.key=key; AE.rec=rec; AE.onDone=onDone; AE.sel=-1; AE.drag=null;
  AE.arrows = (rec.arrows||[]).map(a=>({...a}));
  document.getElementById('aeTitle').textContent = title + ' の矢印';
  if(aeUrl) URL.revokeObjectURL(aeUrl);
  aeUrl = URL.createObjectURL(rec.blob); aeImg.src = aeUrl;
  try{ await aeImg.decode(); }
  catch(e){ alert('写真を読み込めませんでした。少し待ってからもう一度開くか、「差し替え」で入れ直してください。'); return; }
  AE.iw=aeImg.naturalWidth; AE.ih=aeImg.naturalHeight;
  aeEl.classList.add('show'); document.body.style.overflow='hidden';
  aeLayout(); aeSwatches(); aeSync();
}
function aeLayout(){
  if(!aeEl.classList.contains('show')) return;
  const r = aeStage.getBoundingClientRect(), m = 8;
  AE.scale = Math.min((r.width-m*2)/AE.iw, (r.height-m*2)/AE.ih);
  const w = AE.iw*AE.scale, h = AE.ih*AE.scale;
  for(const e of [aeImg, aeSvg]){ e.style.width=w+'px'; e.style.height=h+'px'; e.style.left=(r.width-w)/2+'px'; e.style.top=(r.height-h)/2+'px'; }
  aeSvg.setAttribute('viewBox',`0 0 ${AE.iw} ${AE.ih}`);
  aeDraw();
}
addEventListener('resize', aeLayout);
function aeSwatches(){
  const box = document.getElementById('aeSw'); box.innerHTML='';
  for(const c of ACOLORS){
    const b = document.createElement('button'); b.className='sw'+(c===aeCur().c?' on':''); b.style.background=c; b.setAttribute('aria-label','色');
    b.onclick = ()=>{ AE.color=c; if(AE.sel>=0) AE.arrows[AE.sel].c=c; aeSwatches(); aeDraw(); };
    box.append(b);
  }
}
function aeCur(){ return AE.sel>=0 ? AE.arrows[AE.sel] : {c:AE.color, w:AE.w}; }
function aeSync(){
  const has = AE.sel>=0;
  document.getElementById('aeDel').disabled = !has; document.getElementById('aeFlip').disabled = !has;
  aeW.value = Math.round(aeCur().w*1000); aeSwatches(); aeDraw();
}
function aeDraw(){
  const iw=AE.iw, ih=AE.ih, hr = 16/AE.scale;   // つまみの半径（画面で16px）
  let html = AE.arrows.map((a,i)=> arrowSvg(a,iw,ih)).join('');
  if(AE.sel>=0){
    const a = AE.arrows[AE.sel];
    html += `<line x1="${a.x1*iw}" y1="${a.y1*ih}" x2="${a.x2*iw}" y2="${a.y2*ih}" stroke="#f2b705" stroke-width="${2/AE.scale}" stroke-dasharray="${6/AE.scale}"/>`;
    for(const [x,y] of [[a.x1,a.y1],[a.x2,a.y2]])
      html += `<circle cx="${x*iw}" cy="${y*ih}" r="${hr}" fill="rgba(242,183,5,.35)" stroke="#f2b705" stroke-width="${3/AE.scale}"/>`;
  }
  aeSvg.innerHTML = html;
}
function aePt(e){ const r = aeSvg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; }
function aeHit(p){
  const iw=AE.iw, ih=AE.ih, x=p[0]*iw, y=p[1]*ih, tol = 26/AE.scale;
  if(AE.sel>=0){
    const a = AE.arrows[AE.sel];
    if(Math.hypot(x-a.x2*iw, y-a.y2*ih) < tol) return {i:AE.sel, part:'end'};
    if(Math.hypot(x-a.x1*iw, y-a.y1*ih) < tol) return {i:AE.sel, part:'start'};
  }
  for(let i=AE.arrows.length-1;i>=0;i--){
    const a = AE.arrows[i], ax=a.x1*iw, ay=a.y1*ih, bx=a.x2*iw, by=a.y2*ih;
    const L2=(bx-ax)**2+(by-ay)**2 || 1, t=Math.max(0,Math.min(1,((x-ax)*(bx-ax)+(y-ay)*(by-ay))/L2));
    if(Math.hypot(x-(ax+t*(bx-ax)), y-(ay+t*(by-ay))) < Math.max(tol, a.w*iw*1.6)) return {i, part:'body'};
  }
  return null;
}
aeSvg.addEventListener('pointerdown', e=>{
  e.preventDefault(); aeSvg.setPointerCapture(e.pointerId);
  const p = aePt(e), h = aeHit(p);
  if(h){ AE.sel=h.i; AE.drag={part:h.part, p0:p, a0:{...AE.arrows[h.i]}}; }
  else { AE.arrows.push({x1:p[0],y1:p[1],x2:p[0],y2:p[1],w:AE.w,c:AE.color}); AE.sel=AE.arrows.length-1; AE.drag={part:'new', p0:p}; }
  aeSync();
});
aeSvg.addEventListener('pointermove', e=>{
  if(!AE.drag) return; e.preventDefault();
  const p = aePt(e), a = AE.arrows[AE.sel], d = AE.drag, cl = v=>Math.max(0,Math.min(1,v));
  if(d.part==='end' || d.part==='new'){ a.x2=cl(p[0]); a.y2=cl(p[1]); }
  else if(d.part==='start'){ a.x1=cl(p[0]); a.y1=cl(p[1]); }
  else { const dx=p[0]-d.p0[0], dy=p[1]-d.p0[1]; a.x1=d.a0.x1+dx; a.y1=d.a0.y1+dy; a.x2=d.a0.x2+dx; a.y2=d.a0.y2+dy; }
  aeDraw();
});
const aeUp = ()=>{
  if(!AE.drag) return;
  if(AE.drag.part==='new'){   // 短すぎる「なぞり」はタップとみなして取り消す
    const a = AE.arrows[AE.sel];
    if(Math.hypot((a.x2-a.x1)*AE.iw,(a.y2-a.y1)*AE.ih)*AE.scale < 25){ AE.arrows.pop(); AE.sel=-1; }
  }
  AE.drag=null; aeSync();
};
aeSvg.addEventListener('pointerup', aeUp); aeSvg.addEventListener('pointercancel', aeUp);
aeW.addEventListener('input', ()=>{ const w = aeW.value/1000; AE.w=w; if(AE.sel>=0) AE.arrows[AE.sel].w=w; aeDraw(); });
document.getElementById('aeAdd').onclick = ()=>{
  AE.arrows.push({x1:0.3,y1:0.6,x2:0.7,y2:0.6,w:AE.w,c:AE.color}); AE.sel=AE.arrows.length-1; aeSync();
};
document.getElementById('aeFlip').onclick = ()=>{
  const a = AE.arrows[AE.sel]; if(!a) return; [a.x1,a.x2,a.y1,a.y2]=[a.x2,a.x1,a.y2,a.y1]; aeDraw();
};
document.getElementById('aeDel').onclick = ()=>{ if(AE.sel<0) return; AE.arrows.splice(AE.sel,1); AE.sel=-1; aeSync(); };
function aeClose(){
  aeEl.classList.remove('show'); document.body.style.overflow='';
  aeImg.removeAttribute('src'); if(aeUrl){ URL.revokeObjectURL(aeUrl); aeUrl=null; }
}
document.getElementById('aeCancel').onclick = aeClose;
document.getElementById('aeDone').onclick = async ()=>{
  if(AE.busy) return;   // 連打で二重保存しない
  AE.busy = true;
  try{ await rewriteRec(AE.key, AE.rec, {arrows:AE.arrows}); toast(`矢印 ${AE.arrows.length} 本を保存しました`); }
  catch(e){ alert('保存できませんでした：' + (e && e.message || e)); return; }
  finally{ AE.busy = false; }
  aeClose(); AE.onDone && AE.onDone();
};

// ===== ZIP保存 =====
async function exportZip(){
  const keys = (await allKeys()).map(String);
  if(!keys.length){ alert('保存する写真がありません。'); return; }
  if(!getWorker() && !confirm('作業者が選ばれていません。\n元写真の仕分けで名前を付けるため、一覧画面で選んでからの保存をおすすめします。\n\nこのままZIP保存しますか？')) return;
  const files = [], rows = [['No','橋梁名','部位','ファイル名','メモ','作業者']], names = new Map(loadList().map(b=>[b.no,b.name]));
  const recs = [];
  for(const key of keys){ const [no,k] = key.split('|'); recs.push({no:+no, k, key, rec: await getPhoto(key)}); }
  const order = (k)=>{ const i = SLOTS.findIndex(s=>s.k===k); return i<0 ? 99 : i; };
  recs.sort((a,b)=> a.no-b.no || order(a.k)-order(b.k) || a.rec.ts-b.rec.ts);
  const exN = new Map(), bad = [];
  for(const r of recs){
    const p = String(r.no).padStart(2,'0'); let fname, label;
    if(r.k===EXTRA){ const n=(exN.get(r.no)||0)+1; exN.set(r.no,n); fname=`${p}_sonota_${String(n).padStart(2,'0')}.jpg`; label='その他'+n; }
    else { fname=`${p}_${r.k}.jpg`; label=SLOTS[order(r.k)].n; }
    let data;
    try{
      const outBlob = (r.rec.arrows && r.rec.arrows.length) ? await burnArrows(r.rec.blob, r.rec.arrows) : r.rec.blob;
      data = new Uint8Array(await outBlob.arrayBuffer());
    }catch(e){ bad.push(`No.${r.no} ${label}`); continue; }   // 読めない写真は飛ばして、最後に知らせる
    files.push({name:fname, data});
    rows.push([r.no, names.get(r.no)||'', label, fname, r.rec.memo||'', r.rec.worker||'']);
  }
  if(!files.length){ alert('写真を読み込めませんでした。少し待ってからもう一度お試しください。'); return; }
  const csv = '﻿' + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  files.push({name:'photo_list.csv', data:new TextEncoder().encode(csv)});
  // 元写真の仕分け用ログ：踏査開始の時刻と、枠に入れた写真の撮影時刻
  const ev = loadLog().map(x=>({no:x.no, kind: x.end ? '終了' : '開始', t:x.t, part:'', w:x.w||''}));
  for(const r of recs){ if(r.rec.shot) ev.push({no:r.no, kind:'写真', t:r.rec.shot, part: r.k===EXTRA ? 'その他' : SLOTS[order(r.k)].n, w:r.rec.worker||''}); }
  ev.sort((a,b)=>a.t-b.t);
  const lrows = [['No','橋梁名','種別','日時','部位','作業者'], ...ev.map(e=>[e.no, names.get(e.no)||'', e.kind, fmtDT(e.t), e.part, e.w])];
  const lcsv = '﻿' + lrows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  files.push({name:'bridge_log.csv', data:new TextEncoder().encode(lcsv)});
  if(bad.length && !confirm(`次の写真を読み込めませんでした（ZIPに入りません）。\n${bad.join('\n')}\n\n「差し替え」で入れ直してから保存するのがおすすめです。\nこのままZIP保存しますか？`)) return;
  const d = new Date(), stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')
            +'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  const safe = curProj().name.replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40) || 'gyomu';
  const name = `${safe}_tousa_photo_${stamp}.zip`;
  const zip = new File([makeZip(files)], name, {type:'application/zip'});
  try{
    if(navigator.canShare && navigator.canShare({files:[zip]})){
      await navigator.share({files:[zip], title:name});
    }else{
      const a = document.createElement('a'); a.href = URL.createObjectURL(zip); a.download = name;
      document.body.append(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    }
    localStorage.setItem(LS_EXPORT, String(Date.now()));
    toast(`${files.length-2}枚をZIPにしました`);
    if(!location.hash) renderList();
  }catch(e){ if(e && e.name!=='AbortError') alert('ZIP保存に失敗しました：' + e.message); }
}

// ===== 設定 =====
const dlg = document.getElementById('dlgSettings');
document.getElementById('btnSettings').onclick = async ()=>{
  const v = localStorage.getItem(LS_LIST);
  document.getElementById('taList').value = v ? JSON.parse(v).map(b=>b.no+'\t'+b.name).join('\n') : '';
  const n = (await allKeys()).length; let info = `業務「${curProj().name}」の写真 ${n} 枚`;
  try{ const e = await navigator.storage.estimate(); info += `（端末全体の使用 約${Math.round(e.usage/1048576)}MB）`; }catch(_){}
  document.getElementById('storeInfo').textContent = info + '。ZIP保存してPCへ渡した後に削除してください。';
  dlg.showModal();
};
document.getElementById('btnCloseSet').onclick = ()=> dlg.close();
document.getElementById('btnSaveList').onclick = ()=>{
  const t = document.getElementById('taList').value.trim();
  if(!t){ localStorage.removeItem(LS_LIST); }
  else{
    const l = parseList(t);
    if(!l.length){ alert('リストを読み取れませんでした。'); return; }
    localStorage.setItem(LS_LIST, JSON.stringify(l));
  }
  dlg.close(); route(); toast('リストを保存しました');
};
document.getElementById('btnClearAll').onclick = async ()=>{
  const last = localStorage.getItem(LS_EXPORT);
  if(!confirm(`業務「${curProj().name}」の写真をすべて削除します。` + (last?'':'\n※この業務はまだ一度もZIP保存していません。') + '\nよろしいですか？')) return;
  await clearAll(); localStorage.removeItem(LS_EXPORT); localStorage.removeItem(LS_LOG); dlg.close(); location.hash=''; route(); toast('削除しました');
};
document.getElementById('btnExport').onclick = exportZip;

// ===== 業務（プロジェクト）管理 =====
function projects(){
  try{ const v = JSON.parse(localStorage.getItem(LS_PROJ)||'null'); if(Array.isArray(v) && v.length) return v; }catch(e){}
  return [];
}
function saveProjects(p){ localStorage.setItem(LS_PROJ, JSON.stringify(p)); }
function curProj(){ return projects().find(p=>p.id===PID) || {id:PID, name:'業務'}; }
function setProject(id){
  PID = id; LS_LIST = 'tousa.list.' + id; LS_EXPORT = 'tousa.lastExport.' + id; LS_LOG = 'tousa.log.' + id;
  localStorage.setItem(LS_CUR, id);
}
const newId = ()=> 'p' + Date.now().toString(36);

// 旧版（業務機能なし）のデータを「業務1」に引き継ぐ
async function initProjects(){
  let p = projects();
  if(!p.length){
    p = [{id:'p1', name:'業務1'}]; saveProjects(p);
    const ol = localStorage.getItem('tousa.list'), oe = localStorage.getItem('tousa.lastExport');
    if(ol){ localStorage.setItem('tousa.list.p1', ol); localStorage.removeItem('tousa.list'); }
    if(oe){ localStorage.setItem('tousa.lastExport.p1', oe); localStorage.removeItem('tousa.lastExport'); }
    const d = await db();
    await new Promise((res,rej)=>{
      const t = d.transaction('photos','readwrite'), st = t.objectStore('photos');
      st.openCursor().onsuccess = (e)=>{
        const c = e.target.result; if(!c) return;
        const k = String(c.key);
        if(/^\d/.test(k)){ st.put(c.value, 'p1|' + k); st.delete(c.key); }   // 旧キーは数字で始まる
        c.continue();
      };
      t.oncomplete = res; t.onerror = ()=> rej(t.error);
    });
  }
  const cur = localStorage.getItem(LS_CUR);
  setProject(p.some(x=>x.id===cur) ? cur : p[0].id);
}

const dlgP = document.getElementById('dlgProj');
async function openProj(){
  const d = await db();
  const keys = await new Promise((res,rej)=>{ const r = d.transaction('photos').objectStore('photos').getAllKeys(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
  const cnt = new Map(); keys.forEach(k=>{ const id = String(k).split('|')[0]; cnt.set(id,(cnt.get(id)||0)+1); });
  const box = document.getElementById('plist'); box.innerHTML = '';
  for(const p of projects()){
    const el = $(`<button class="pitem ${p.id===PID?'cur':''}"><span class="mk"></span><span class="pn">${esc(p.name)}</span><span class="pc">写真 ${cnt.get(p.id)||0} 枚</span></button>`);
    el.onclick = ()=>{ setProject(p.id); dlgP.close(); location.hash=''; route(); toast(`「${p.name}」に切り替えました`); };
    box.append(el);
  }
  if(!dlgP.open) dlgP.showModal();
}
document.getElementById('btnProj').onclick = openProj;
document.getElementById('btnProjClose').onclick = ()=> dlgP.close();
document.getElementById('btnProjAdd').onclick = ()=>{
  const p = projects(), v = prompt('新しい業務名（例：R7焼津市橋梁点検）', `業務${p.length+1}`);
  if(v===null || !v.trim()) return;
  const id = newId(); p.push({id, name:v.trim()}); saveProjects(p);
  setProject(id); dlgP.close(); location.hash=''; route(); toast(`「${v.trim()}」を追加しました`);
};
document.getElementById('btnProjRename').onclick = ()=>{
  const p = projects(), c = p.find(x=>x.id===PID); if(!c) return;
  const v = prompt('業務名を変更', c.name); if(v===null || !v.trim()) return;
  c.name = v.trim(); saveProjects(p); openProj(); route();
};
document.getElementById('btnProjDel').onclick = async ()=>{
  const c = curProj(), n = (await allKeys()).length, last = localStorage.getItem(LS_EXPORT);
  if(!confirm(`業務「${c.name}」を削除します（写真 ${n} 枚と橋梁リストも消えます）。` + (n && !last ? '\n※この業務はまだ一度もZIP保存していません。' : '') + '\nよろしいですか？')) return;
  await clearAll(); localStorage.removeItem(LS_LIST); localStorage.removeItem(LS_EXPORT); localStorage.removeItem(LS_LOG);
  let p = projects().filter(x=>x.id!==PID);
  if(!p.length) p = [{id:newId(), name:'業務1'}];
  saveProjects(p); setProject(p[0].id); dlgP.close(); location.hash=''; route(); toast('業務を削除しました');
};

// ===== ルーティング =====
function route(){
  const m = location.hash.match(/^#b\/(\d+)$/);
  (m ? renderBridge(+m[1]) : renderList()).catch(e=> app.textContent = 'エラー：' + e.message);
  window.scrollTo(0,0);
}
addEventListener('hashchange', route);
initProjects().then(route).catch(e=> app.textContent = '起動エラー：' + e.message);

// オフライン対応・保存領域の保護
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
